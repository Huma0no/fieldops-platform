name: Focused workspace tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workspace-tests.yml"
  workflow_dispatch:

jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldops_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldops_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create isolated test schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema.sql
      - name: Apply required test migrations
        run: |
          npm run db:migrate
          npm run db:migrate2
      - name: Run focused workspace tests
        run: npm test -- --runTestsByPath tests/workspace.test.js --testNamePattern="stores weigh-in against address_id|upserts on second call|preserves hydrated weigh-in fields when one value is changed and the complete record is saved|persists an editable OEM subcooling goal|rejects a non-finite OEM subcooling goal"
