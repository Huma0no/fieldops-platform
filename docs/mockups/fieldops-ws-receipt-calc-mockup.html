<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FieldOps · Receipt + Calc mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Azeret+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f2ef;--tile:#faf9f7;--hi:#ffffff;--lo:#d3d0ca;--ink:#2b2824;--soft:#6b665f;--acc:#a85a18;--accd:#8a4a13;--ok:#2f7a4a;
    --raise:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--raise-s:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);
    --inset:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--paper:#fffefb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Archivo,system-ui,sans-serif;overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top)}
  .mock{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#2b2824;color:#eceae5;font:600 11px 'Azeret Mono',monospace}
  .mock span{flex:1;opacity:.7}
  .mock .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid #57514a}
  .mock button{background:none;border:0;color:#cfc8bd;font:700 11px 'Azeret Mono',monospace;padding:6px 10px}
  .mock button.on{background:var(--acc);color:#fff}
  .view{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 30px;display:none}
  .view.show{display:block}
  h2{margin:4px 2px 12px;font:800 18px Archivo}
  .chip{display:inline-block;font:700 10px 'Azeret Mono',monospace;letter-spacing:.08em;color:var(--soft);padding:3px 8px;border-radius:8px;box-shadow:var(--inset)}

  /* report card + receipt */
  .rwrap{margin:0 0 16px}
  .card{position:relative;z-index:2;background:var(--bg);border-radius:18px;box-shadow:var(--raise);padding:14px 16px}
  .card h3{margin:0 0 2px;font:800 17px Archivo}
  .card .meta{font:600 13px 'Azeret Mono';color:var(--soft)}
  .card .st{font:700 13px 'Azeret Mono';color:var(--ok);margin-top:4px}
  .row{display:flex;align-items:center;gap:8px}
  .grow{flex:1}
  .btns{display:flex;gap:10px;margin-top:12px}
  .btn{height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--bg);box-shadow:var(--raise-s);font:700 14px Archivo;color:var(--accd);cursor:pointer}
  .btn.ghost{color:var(--soft);box-shadow:var(--inset)}
  .btn.pri{background:var(--accd);color:#fff;box-shadow:var(--raise-s)}
  .check{color:var(--ok);font:700 22px Archivo}

  /* the slot that grows; receipt slides down from behind the card */
  .slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.3,.7,.2,1);margin:-14px 10px 0}
  .slot.open{grid-template-rows:1fr}
  .slot>div{overflow:hidden}
  .paper{transform:translateY(-100%);transition:transform .55s cubic-bezier(.3,.7,.2,1)}
  .slot.open .paper{transform:none}
  .receipt{background:var(--paper);padding:26px 18px 30px;font:13px/1.45 'Azeret Mono',monospace;color:var(--ink);
    box-shadow:0 6px 14px rgba(0,0,0,.08);position:relative;
    -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x;
            mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x}
  .receipt .hd{text-align:center;border-bottom:1px dashed #cfcac2;padding-bottom:10px;margin-bottom:10px}
  .receipt .hd b{display:block;font:800 15px Archivo}
  .receipt .hd small{color:var(--soft)}
  .sec{margin:10px 0 2px;font-weight:700;letter-spacing:.06em;font-size:11px;color:var(--soft)}
  .li{display:flex;gap:6px}
  .li .t{flex:1}
  .li .tree{color:#b9b3aa}
  .li .p{min-width:64px;text-align:right}
  .note{color:var(--soft);font-size:12px}
  .tot{display:flex;border-top:1px dashed #cfcac2;margin-top:12px;padding-top:10px;font-weight:700;font-size:15px}
  .tot .t{flex:1}
  .draft{position:absolute;top:8px;right:12px;font:700 10px 'Azeret Mono';color:#b5641e;border:1.5px solid #b5641e;border-radius:6px;padding:2px 6px;transform:rotate(6deg)}
  .actions{display:flex;gap:10px;margin-top:16px}
  .actions .btn{flex:1}

  /* calc */
  .panel{background:var(--bg);border-radius:18px;box-shadow:var(--raise);padding:14px 16px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;padding:4px;border-radius:12px;box-shadow:var(--inset);margin-bottom:12px}
  .tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font:700 12px 'Azeret Mono';color:var(--soft)}
  .tabs button.on{background:var(--bg);box-shadow:var(--raise-s);color:var(--accd)}
  label{display:block;font:700 11px 'Azeret Mono';letter-spacing:.05em;color:var(--soft);margin:8px 2px 4px}
  input,select{width:100%;height:44px;border:0;border-radius:12px;background:var(--tile);box-shadow:var(--inset);padding:0 12px;font:600 16px 'Azeret Mono';color:var(--ink)}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .breakdown{font:13px/1.6 'Azeret Mono';background:var(--tile);border-radius:12px;box-shadow:var(--inset);padding:12px 14px;margin-top:12px}
  .breakdown .big{font:800 26px Archivo;color:var(--accd);margin-top:6px}
  .breakdown .warn{color:#a33;font-size:12px}
  .or{display:flex;align-items:center;gap:10px;margin:14px 4px 2px;color:#b9b3aa;font:600 10px 'Azeret Mono';letter-spacing:.1em}
  .or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#d8d4cd,transparent)}
  .tag{font:700 9px 'Azeret Mono';padding:2px 6px;border-radius:6px;margin-left:6px;box-shadow:var(--inset);color:var(--accd)}
  .tag:empty{display:none}
  .ref{display:inline-block;font:700 11px 'Azeret Mono';padding:3px 8px;border-radius:8px;background:var(--bg);box-shadow:var(--raise-s);color:var(--ink);margin-left:6px;vertical-align:middle}
  input.auto{color:var(--accd)}
</style>
</head>
<body>
<div class="app">
  <div class="mock"><span>MOCKUP</span><div class="seg"><button data-v="reports" class="on">Reports</button><button data-v="review">Review</button><button data-v="calc">Calc</button></div></div>

  <!-- REPORTS -->
  <section class="view show" id="v-reports">
    <h2>Reports</h2>
    <div id="list"></div>
  </section>

  <!-- REVIEW BEFORE SEND -->
  <section class="view" id="v-review">
    <h2>Review before sending</h2>
    <div id="reviewBox"></div>
    <div class="actions"><button class="btn ghost" id="edit">Edit</button><button class="btn pri" id="send">Confirm &amp; send</button></div>
    <p class="note" style="text-align:center;margin-top:10px" id="sentMsg"></p>
  </section>

  <!-- CALC -->
  <section class="view" id="v-calc">
    <h2>Quick Charge Calc</h2>
    <div class="panel">
      <div class="two">
        <div><label>FT1 (cable mark)</label><input id="ft1" inputmode="numeric" placeholder="—"></div>
        <div><label>FT2 (cable mark)</label><input id="ft2" inputmode="numeric" placeholder="—"></div>
      </div>
      <div class="or"><span>or</span></div>
      <label>TOTAL LINESET FT</label>
      <input id="tot" inputmode="numeric" placeholder="—" value="55">
      <div class="two">
        <div style="flex:1.4"><label>MANUFACTURER</label><div style="position:relative"><select id="mf"></select><input id="mfTxt" style="display:none" placeholder="Type brand…"></div></div>
        <div><label>FACTORY LEN</label><select id="len"></select></div>
      </div>
      <div class="two" id="xRow" style="display:none">
        <div id="xOz"><label>OZ / FT</label><input id="ozft" inputmode="decimal" placeholder="0.6"></div>
        <div id="xRef"><label>REFRIGERANT</label><input id="refIn" placeholder="R-…"></div>
        <div id="xLen"><label>LENGTH FT</label><input id="lenIn" inputmode="numeric" placeholder="ft"></div>
      </div>
      <div class="breakdown" id="bd"></div>
    </div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
/* ---------- sample report (one address) ---------- */
const R={addr:'4821 Cedar Hollow Ln',sub:'Bridgeland',builder:'Perry Homes',date:'Nov 16, 2026',tech:'Kristo',
  groups:[
    ['SERVICE',[['AC start · System 1',65]]],
    ['T-STAT',[['Daikin One Touch × 3',45]]],
    ['ACCESSORIES',[['UT3000',40],['DAPC',20],['EEV Wire',10],['eBypass',15]]],
    ['FIX',[['Ext. Wire › Furnace',25],['Fixed Leaks › eCoil',35]]],
  ],
  weigh:'System 1 · 55 ft · +15 oz · total 9 lb 4 oz',
  checklist:['No/Incomplete pdrain at ecoil','Media filter missing'],
  notes:'Owner asked to recheck zone 2 damper next visit.'};
const money=n=>'$'+n.toFixed(2);
function receipt(r,draft){
  const total=r.groups.flatMap(g=>g[1]).reduce((a,b)=>a+b[1],0);
  return `<div class="receipt">${draft?'<span class="draft">DRAFT</span>':''}
    <div class="hd"><b>${r.addr}</b><small>${r.sub} · ${r.builder}<br>${r.date} · ${r.tech}</small></div>
    ${r.groups.map(([g,items])=>`<div class="sec">${g}</div>${items.map((it,i)=>`<div class="li"><span class="tree">${i===items.length-1?'└':'├'}</span><span class="t">${it[0]}</span><span class="p">${money(it[1])}</span></div>`).join('')}`).join('')}
    <div class="sec">WEIGH-IN</div><div class="li"><span class="tree">└</span><span class="t">${r.weigh}</span></div>
    <div class="sec">CHECKLIST</div>${r.checklist.map((c,i)=>`<div class="li"><span class="tree">${i===r.checklist.length-1?'└':'├'}</span><span class="t">${c}</span></div>`).join('')}
    <div class="sec">NOTES</div><div class="note">${r.notes}</div>
    <div class="tot"><span class="t">TOTAL</span><span>${money(total)}</span></div></div>`;
}
/* ---------- reports list ---------- */
const cards=[{...R},{...R,addr:'1907 Amber Ridge Dr',sub:'Towne Lake',builder:'Lennar',groups:[['SERVICE',[['Prestart · System 1',55]]],['T-STAT',[['Daikin One Touch × 1',15]]]],checklist:['Media filter missing'],notes:'—',weigh:'—'}];
$('list').innerHTML=cards.map((c,i)=>{const t=c.groups.flatMap(g=>g[1]).reduce((a,b)=>a+b[1],0);
  return `<div class="rwrap"><div class="card"><div class="row"><div class="grow"><h3>${c.addr}</h3><div class="meta">${c.sub} · ${money(t)}</div><div class="st">Sent</div></div><span class="check">✓</span></div>
  <div class="btns"><button class="btn" data-i="${i}">View report</button><button class="btn ghost">Download</button></div></div>
  <div class="slot" id="s${i}"><div><div class="paper">${receipt(c,false)}</div></div></div></div>`}).join('');
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
  const s=$('s'+b.dataset.i), open=!s.classList.contains('open');
  s.classList.toggle('open',open); b.textContent=open?'Hide report':'View report';
});
/* ---------- review ---------- */
$('reviewBox').innerHTML=receipt(R,true);
$('send').onclick=()=>{ $('sentMsg').textContent='Sent ✓ — this same receipt now lives in Reports.'; };
$('edit').onclick=()=>{ $('sentMsg').textContent='(Back to Workspace)'; };
/* ---------- calc ---------- */
// manufacturer → oz/ft + refrigerant (SAMPLE; real values come from the catalog)
const MF={Daikin:{oz:0.6,ref:'R-32'},Goodman:{oz:0.6,ref:'R-32'},Lennox:{oz:0.6,ref:'R-454B'},Trane:{oz:0.47,ref:'R-454B'}};
const DEF_LEN={Daikin:15,Goodman:15,Lennox:30,Trane:15};
$('mf').innerHTML=[...Object.keys(MF).map(m=>`<option value="${m}"${m==='Lennox'?' selected':''}>${m}</option>`),'<option value="new">+ New</option>'].join('');
function fillLen(v){ $('len').innerHTML=[10,15,25,30].map(l=>`<option value="${l}"${l===v?' selected':''}>${l} ft</option>`).join('')+'<option value="custom">+ Custom</option>'; }
fillLen(30);
$('mf').addEventListener('change',()=>{ const v=$('mf').value; if(v==='new'){ $('mf').style.display='none'; $('mfTxt').style.display='block'; $('mfTxt').focus(); } else fillLen(DEF_LEN[v]); calc(); });
['len','ozft','refIn','lenIn','mfTxt'].forEach(id=>$(id).addEventListener('input',calc));
// One screen, two methods, mutually exclusive: using one clears the other.
function marksTotal(){ const a=$('ft1').value, b=$('ft2').value; return (a!==''&&b!=='') ? Math.abs(+a - +b) : null; }
function onMarks(){ if($('tot').value!==''){ $('tot').value=''; } const t=marksTotal(); $('tot').placeholder = t!==null ? `= ${t} ft` : '—'; calc(); }
$('ft1').addEventListener('input',onMarks); $('ft2').addEventListener('input',onMarks);
$('tot').addEventListener('input',()=>{ if($('ft1').value||$('ft2').value){ $('ft1').value=''; $('ft2').value=''; } $('tot').placeholder='—'; calc(); });

function calc(){
  const m=$('mf').value, isNew=m==='new', isCustom=$('len').value==='custom';
  $('xRow').style.display=(isNew||isCustom)?'flex':'none'; $('xOz').style.display=isNew?'block':'none'; $('xRef').style.display=isNew?'block':'none'; $('xLen').style.display=isCustom?'block':'none';
  const oz=isNew?(+$('ozft').value||0):MF[m].oz, ref=isNew?($('refIn').value||'—'):MF[m].ref, base=isCustom?(+$('lenIn').value||0):+$('len').value;
  const mt=marksTotal(), useMarks = mt!==null && $('tot').value==='';
  const total = useMarks ? mt : (+$('tot').value||0);
  if(!useMarks && $('tot').value===''){ $('bd').innerHTML='<div class="note">—</div>'; return; }
  const extra=total-base, add=+(extra*oz).toFixed(1);
  const src = useMarks ? `<div>|${$('ft1').value} − ${$('ft2').value}| = ${total} ft</div>` : '';
  $('bd').innerHTML=`${src}
    <div>${total} ft − ${base} ft = <b>${extra} ft ${extra>=0?'extra':'short'}</b></div>
    <div>${extra} ft × ${oz} oz/ft = <b>${add} oz</b></div>
    <div class="big">${add>=0?'+':''}${add} oz<span class="ref">${ref}</span></div>
    ${extra<0?'<div class="warn">Lineset shorter than factory baseline — no refrigerant to add.</div>':''}`;
}
calc();
/* ---------- view switch ---------- */
document.querySelectorAll('.mock button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mock button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show',v.id==='v-'+b.dataset.v));});
</script>
</body>
</html>
