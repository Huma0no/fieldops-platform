<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FieldOps · Acc + Fix mockup (templates)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Azeret+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f2ef;--tile:#faf9f7;--hi:#ffffff;--lo:#d3d0ca;--ink:#2b2824;--soft:#6b665f;--acc:#a85a18;--accd:#8a4a13;--warn:#b42318;
    --raise:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--raise-s:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);
    --inset:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Archivo,system-ui,sans-serif;overscroll-behavior:none}
  .app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top)}
  .mock{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#2b2824;color:#eceae5;font:600 11px 'Azeret Mono',monospace}
  .mock span{flex:1;opacity:.7}
  .mock .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid #57514a}
  .mock button{background:none;border:0;color:#cfc8bd;font:700 11px 'Azeret Mono',monospace;padding:6px 9px}
  .mock button.on{background:var(--acc);color:#fff}
  .banner{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
  .banner .grow{flex:1} .banner b{display:block;font:800 16px Archivo} .banner span{font:600 11px 'Azeret Mono';color:var(--soft)}
  .total{font:700 13px 'Azeret Mono';color:var(--accd)}
  .rail{display:flex;gap:6px;padding:4px 14px 10px}
  .rail button{flex:1;border:0;background:none;padding:8px 0;border-radius:10px;font:700 11px 'Azeret Mono';color:var(--soft);box-shadow:var(--inset)}
  .rail button.on{box-shadow:var(--raise-s);color:var(--accd)}
  .body{flex:1;overflow-y:auto;padding:4px 14px 40px}
  .tpl{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font:600 11px 'Azeret Mono';color:var(--soft)}
  .tpl b{color:var(--accd)}
  .tpl .grow{flex:1}
  .link{border:0;background:none;font:700 11px 'Azeret Mono';color:var(--accd);padding:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;grid-auto-flow:dense}
  .t{position:relative;min-height:58px;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--raise-s);font:700 13px 'Azeret Mono';color:var(--soft);cursor:pointer;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:box-shadow .15s,color .15s}
  .t.w2{grid-column:span 2}
  .t.on{box-shadow:var(--inset);color:var(--accd)}
  .t.comp{border:1.5px dashed #d8b48f}
  .t .p{font:600 10px 'Azeret Mono';color:#a49e95}
  .t.add{color:var(--accd);border:1.5px dashed #cfcac2;box-shadow:none;background:transparent}
  .subs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
  .s{height:30px;padding:0 10px;border:0;border-radius:9px;background:var(--bg);box-shadow:var(--raise-s);font:700 11px 'Azeret Mono';color:var(--soft)}
  .s.on{box-shadow:var(--inset);color:var(--accd)}
  .need{font:700 10px 'Azeret Mono';color:var(--warn)}
  .custom{display:flex;gap:8px;margin-top:14px}
  .custom input{height:44px;border:0;border-radius:12px;background:var(--tile);box-shadow:var(--inset);padding:0 12px;font:600 14px 'Azeret Mono';color:var(--ink);min-width:0}
  .custom input.d{flex:1}.custom input.m{width:80px}
  .custom button{width:44px;height:44px;border:0;border-radius:12px;background:var(--bg);box-shadow:var(--raise-s);font:800 18px Archivo;color:var(--accd)}
  .lines{margin-top:8px;font:12px 'Azeret Mono';color:var(--ink)}
  .lines div{display:flex;padding:3px 2px}.lines div span:first-child{flex:1}
  .note{font:600 11px 'Azeret Mono';color:var(--soft);margin:12px 2px 0}
  /* add sheet */
  .scrim{position:absolute;inset:0;background:rgba(43,40,36,.25);display:none;z-index:9}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.15);padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column;z-index:10}
  .show{display:flex!important}.scrim.show{display:block!important}
  .sheet input{height:44px;border:0;border-radius:12px;background:var(--tile);box-shadow:var(--inset);padding:0 12px;font:600 15px Archivo;margin-bottom:10px}
  .sheet .list{overflow-y:auto}
  .row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #e7e4de}
  .row .n{flex:1;font:700 14px Archivo}
  .row .n small{display:block;font:600 11px 'Azeret Mono';color:var(--soft)}
  .row button{border:0;background:var(--bg);box-shadow:var(--raise-s);border-radius:10px;height:34px;padding:0 12px;font:700 12px 'Azeret Mono';color:var(--accd)}
  .row .star{width:34px;padding:0;color:#b9b3aa;font-size:16px}
  .row .star.on{color:var(--acc)}
</style>
</head>
<body>
<div class="app">
  <div class="mock"><span>MOCKUP · TEMPLATE LAYOUT</span></div>
  <div class="banner"><div class="grow"><b>4821 Cedar Hollow Ln</b><span>Bridgeland · 2 systems</span></div><span class="total" id="tot">$0</span></div>
  <div class="rail"><button>Srv+T</button><button data-step="acc" class="on">Acc</button><button data-step="fix">Fix</button><button>Wght</button><button>Notes</button></div>
  <div class="body">
    <div class="tpl" id="tplBar"></div>
    <div class="grid" id="grid"></div>
    <div id="customWrap"></div>
    <p class="note" id="note"></p>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div style="display:flex;align-items:center;margin-bottom:8px"><b style="flex:1;font:800 15px Archivo">Add item</b><button class="link" id="done">Done</button></div><input id="q" placeholder="Search…">
  <div class="custom" style="margin:0 0 6px"><input class="d" id="cd" placeholder="+ Other — description"><input class="m" id="cm" inputmode="decimal" placeholder="$"><button id="cadd">✓</button></div>
  <div id="tsNote" style="font:600 10px 'Azeret Mono';color:#6b665f;margin:0 2px 8px"></div><div class="list" id="list"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
/* ---------- catalog (fixed design order = current layout) — sample prices ---------- */
const ACC=[
 {id:'UT3000',w:2,p:40,board:'ut'},{id:'HZ322',p:120,board:'hz'},
 {id:'DAPC',p:20,comp:'ut'},{id:'EEV Wire',p:10,comp:'ut'},{id:'eBypass',p:15,comp:'ut'},
 {id:'Harmony',w:2,p:90},{id:'Bypass',p:25,comp:'hz'},
 {id:'FIN180P',p:20},{id:'Float Switch',p:15},{id:'Dehum',p:60},
 {id:'Trane Harness',p:10},{id:'AprilAire',p:45},{id:'F/A',p:30},{id:'FIN6-MD',p:20},
 {id:'RDS',p:15},{id:'LP Kit',w:2,p:35,subs:['Lennox 1Stg','Lennox 2Stg','Goodman']},
];
const FIX=[
 {id:'Pressure Test',p:30},{id:'Open eCoil',p:25},{id:'Jammed Wires',p:20},
 {id:'Stuck Blower',p:25},{id:'Sheetrock',p:40},
 {id:'Fixed Leaks',w:2,p:35,subs:['eCoil','Cunit','Wall']},
 {id:'Ext. Wire',w:2,p:25,subs:['Furnace','Cunit'],req:true},
];
// sample usage history (last 30 reports) → suggested template
const USE={UT3000:22,DAPC:21,'EEV Wire':21,eBypass:20,'Float Switch':17,'F/A':12,'Trane Harness':9,'LP Kit':6,HZ322:3,Dehum:2,'Pressure Test':25,'Fixed Leaks':14,'Ext. Wire':11,'Open eCoil':6,'Jammed Wires':3};
const TPL_SIZE={acc:6,fix:4};

let step='acc', mode='tpl', sel={}, subs={}, pinned={acc:null,fix:null}, added={acc:new Set(),fix:new Set()}, custom={acc:[],fix:[]};
const cat=()=>step==='acc'?ACC:FIX;
function suggested(){ // top N by usage (companions don't count toward the template; they ride with their board)
  return cat().filter(x=>!x.comp).sort((a,b)=>(USE[b.id]||0)-(USE[a.id]||0)).slice(0,TPL_SIZE[step]).map(x=>x.id);
}
function templateIds(){ return pinned[step] || suggested(); }

/* ---------- rules ---------- */
function toggle(x){
  const on=!sel[x.id];
  if(x.board||x.comp){
    const g = x.board || x.comp;
    if(on){
      // zone boards are mutually exclusive
      const other = g==='ut'?'hz':'ut';
      ACC.filter(a=>a.board===other||a.comp===other).forEach(a=>{ delete sel[a.id]; });
      if(x.board){ ACC.filter(a=>a.comp===g).forEach(a=>sel[a.id]=true); } // board brings its companions
    }
  }
  if(on) sel[x.id]=true; else { delete sel[x.id]; delete subs[x.id]; if(x.board) ACC.filter(a=>a.comp===x.board).forEach(a=>delete sel[a.id]); }
  render();
}
function toggleSub(x,s){ subs[x.id]=subs[x.id]||new Set(); subs[x.id].has(s)?subs[x.id].delete(s):subs[x.id].add(s); render(); }

/* ---------- render ---------- */
function visible(){
  const list=cat();
  const activeBoards=new Set(ACC.filter(a=>a.board&&sel[a.id]).map(a=>a.board));
  const isComp=x=>x.comp && step==='acc';
  if(mode==='all') return list.filter(x=>!isComp(x) || activeBoards.has(x.comp));
  // template mode: template items ordered by usage + companions of active boards + anything selected/added, then the rest stays behind +Add
  const t=templateIds();
  const ids=new Set([...t, ...added[step], ...list.filter(x=>sel[x.id]).map(x=>x.id)]);
  let v=list.filter(x=>ids.has(x.id) && !isComp(x));
  v.sort((a,b)=>b.p-a.p);
  // companions go right after their board
  const out=[]; v.forEach(x=>{ out.push(x); if(x.board && sel[x.id]) list.filter(c=>c.comp===x.board).forEach(c=>out.push(c)); });
  return out;
}
function render(){
  document.querySelectorAll('.rail [data-step]').forEach(b=>b.classList.toggle('on',b.dataset.step===step));
  const v=visible();
  $('tplBar').innerHTML = mode==='tpl'
    ? `<span class="grow">Template: <b>${pinned[step]?'yours':'suggested'}</b> · from your last 30 reports</span>${pinned[step]?'<button class="link" id="resetTpl">reset</button>':''}`
    : `<span class="grow">Full grid · fixed order</span>`;
  if($('resetTpl')) $('resetTpl').onclick=()=>{ pinned[step]=null; render(); };
  $('grid').innerHTML = v.map(x=>{
    const on=!!sel[x.id];
    const sub = x.subs && on ? `<div class="subs">${x.subs.map(s=>`<button class="s${subs[x.id]&&subs[x.id].has(s)?' on':''}" data-x="${x.id}" data-s="${s}">${s}</button>`).join('')}</div>${x.req&&!(subs[x.id]&&subs[x.id].size)?'<span class="need">choose location</span>':''}` : '';
    return `<div role="button" tabindex="0" class="t${x.w?' w2':''}${on?' on':''}${x.comp?' comp':''}" data-id="${x.id}">${x.id}${sub||`<span class="p">$${x.p}</span>`}</div>`;
  }).join('') + (mode==='tpl' ? `<div role="button" class="t add" id="addBtn">+ Add</div>` : '');
  $('grid').querySelectorAll('.t[data-id]').forEach(b=>b.onclick=e=>{ if(e.target.closest('.s')) return; toggle(cat().find(x=>x.id===b.dataset.id)); });
  $('grid').querySelectorAll('.s').forEach(b=>b.onclick=e=>{ e.stopPropagation(); toggleSub(cat().find(x=>x.id===b.dataset.x),b.dataset.s); });
  if($('addBtn')) $('addBtn').onclick=openSheet;
  // custom line on Fix
  const ts = step==='acc';
  $('customWrap').innerHTML = custom[step].length ? `<div class="lines" style="margin-top:14px">${custom[step].map(c=>`<div><span>Other · ${c[0]}${ts?' <em style="font-style:normal;font:700 9px Azeret Mono;color:#8a4a13;box-shadow:var(--inset);padding:2px 6px;border-radius:6px">TECH SUPPLIED</em>':''}</span><span>$${c[1]}</span></div>`).join('')}</div>` : '';
  $('note').textContent = step==='acc' ? 'Ordered by price, high → low. Dashed = companion of the active zone board.' : 'Ordered by price, high → low. Ext. Wire needs a location.';
  // total (subs multiply the base price per location chosen)
  let t=0; [...ACC,...FIX].forEach(x=>{ if(sel[x.id]) t+= x.subs ? x.p*Math.max(1,(subs[x.id]||new Set()).size) : x.p; }); custom.acc.concat(custom.fix).forEach(c=>t+=c[1]);
  $('tot').textContent='$'+t;
}
/* ---------- +Add sheet ---------- */
function openSheet(){ $('scrim').classList.add('show'); $('sheet').classList.add('show'); $('q').value=''; $('tsNote').textContent = step==='acc' ? 'Other accessories are Tech supplied and never enter the catalog.' : 'Other fixes are added to this report only.'; list(); }
function closeSheet(){ $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
$('scrim').onclick=closeSheet; $('done').onclick=closeSheet;
function list(){
  const tpl=new Set(templateIds()), shown=new Set(visible().map(x=>x.id)), q=$('q').value.toLowerCase();
  const items=cat().filter(x=>!x.comp && x.id.toLowerCase().includes(q));
  $('list').innerHTML = items.map(x=>`<div class="row"><div class="n">${x.id}<small>$${x.p}${USE[x.id]?' · used '+USE[x.id]+'×':''}</small></div>
    <button class="star${tpl.has(x.id)?' on':''}" data-pin="${x.id}" title="Keep in template">★</button>
    <button data-add="${x.id}">${shown.has(x.id)?'Shown':'Add'}</button></div>`).join('');
  $('list').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const x=cat().find(i=>i.id===b.dataset.add); added[step].add(x.id); if(!sel[x.id]) toggle(x); closeSheet(); });
  $('list').querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{ const cur=new Set(templateIds()); cur.has(b.dataset.pin)?cur.delete(b.dataset.pin):cur.add(b.dataset.pin); pinned[step]=[...cur]; list(); render(); });
}
$('q').oninput=list;
$('cadd').onclick=()=>{ const d=$('cd').value.trim(), m=+$('cm').value; if(d&&m){ custom[step].push([d,m]); $('cd').value=''; $('cm').value=''; closeSheet(); render(); } };
document.querySelectorAll('.rail [data-step]').forEach(b=>b.onclick=()=>{ step=b.dataset.step; render(); });

// intake pre-selected accessories (example)
sel['UT3000']=true; ['DAPC','EEV Wire','eBypass'].forEach(i=>sel[i]=true);
render();
</script>
</body>
</html>
