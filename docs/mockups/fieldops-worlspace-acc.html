<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FieldOps · Acc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Azeret+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#eceae5;--hi:#ffffff;--sh:#c8c4bc;--well:#e3e0da;--tile:#f5f3ef;
    --ink:#221e19;--ink-soft:#7d776e;--accent:#b5641e;--accent-deep:#8a4a13;--ok:#3d6b3f;--danger:#9e2b1e;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);width:100dvw;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--panel)}

  .topnav{flex:0 0 auto;padding-top:var(--sat);background:var(--panel);position:relative;z-index:6;box-shadow:inset 0 1px 0 var(--hi),0 4px 9px var(--sh)}
  .tabs{display:flex;height:40px;padding:0 6px}
  .tab{flex:1;border:0;background:transparent;cursor:pointer;margin:5px 3px;border-radius:11px;font-family:'Archivo';font-weight:700;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
  .tab.on{color:var(--accent-deep);box-shadow:inset 2px 2px 4px var(--sh),inset -2px -2px 4px var(--hi)}

  .active{flex:0 0 auto;margin:14px 15px 0;background:var(--well);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:11px;box-shadow:inset 4px 4px 9px var(--sh),inset -4px -4px 9px var(--hi)}
  .active .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;box-shadow:0 0 0 3px rgba(181,100,30,.15)}
  .active .aj{flex:1;min-width:0}
  .active .lbl{font-family:'Azeret Mono';font-size:7.5px;letter-spacing:.2em;color:var(--ink-soft)}
  .active .addr{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.2;margin-top:1px}
  .active .meta{font-family:'Azeret Mono';font-size:9px;color:var(--ink-soft);letter-spacing:.03em;margin-top:2px}
  .active .total{font-family:'Azeret Mono';font-weight:700;font-size:13px;color:var(--accent-deep);padding:5px 10px;border-radius:20px;background:var(--panel);box-shadow:-2px -2px 4px var(--hi),3px 3px 6px var(--sh)}
  .active .cancel{border:0;background:var(--panel);cursor:pointer;color:var(--danger);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:-2px -2px 4px var(--hi),3px 3px 6px var(--sh)}

  .rail{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:12px 15px 2px;scrollbar-width:none}
  .rail::-webkit-scrollbar{height:0}
  .step{flex:1 0 auto;min-width:60px;border:0;background:var(--panel);cursor:pointer;border-radius:12px;padding:9px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:-3px -3px 6px var(--hi),3px 4px 7px var(--sh)}
  .step .sl{font-family:'Azeret Mono';font-weight:700;font-size:9px;letter-spacing:.04em;color:var(--ink-soft)}
  .step .sd{width:5px;height:5px;border-radius:50%;background:var(--sh)}
  .step.cur{box-shadow:inset 2px 2px 5px var(--sh),inset -2px -2px 5px var(--hi)}
  .step.cur .sl{color:var(--accent-deep)}.step.cur .sd{background:var(--accent)}

  .scroll{flex:1;overflow-y:auto;padding:14px 15px 8px}
  .scroll::-webkit-scrollbar{width:0}
  .section{background:var(--panel);border-radius:20px;padding:16px;box-shadow:-6px -6px 12px var(--hi),6px 7px 14px var(--sh)}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head .bar{width:4px;height:18px;border-radius:3px;background:var(--accent)}
  .sec-head .st{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .sec-head .sub{font-family:'Azeret Mono';font-size:8.5px;letter-spacing:.06em;color:var(--ink-soft);margin-left:auto}

  /* ACC grid — order preserved from legacy */
  .acc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    grid-template-areas:
      "ut ut ut hz"
      "da ec eb hz"
      "ha ha ha by"
      "f1 fs wd dh"
      "th ap fa f6"
      "rd lp lp ot";}
  .a{border:0;background:var(--tile);cursor:pointer;border-radius:12px;min-height:52px;padding:6px 8px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Azeret Mono';font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--ink);line-height:1.2;box-shadow:-3px -3px 6px var(--hi),3px 4px 7px var(--sh)}
  .a:active{transform:translateY(1px)}
  .a.on{color:var(--accent-deep);box-shadow:inset 3px 3px 6px var(--sh),inset -3px -3px 6px var(--hi)}
  .a.grp.on{color:var(--accent-deep)}
  .ut{grid-area:ut}.hz{grid-area:hz}.da{grid-area:da}.ec{grid-area:ec}.eb{grid-area:eb}
  .ha{grid-area:ha}.by{grid-area:by}.f1{grid-area:f1}.fs{grid-area:fs}.wd{grid-area:wd}.dh{grid-area:dh}
  .th{grid-area:th}.ap{grid-area:ap}.fa{grid-area:fa}.f6{grid-area:f6}.rd{grid-area:rd}.lp{grid-area:lp}.ot{grid-area:ot}

  /* LP Kit sub-options */
  .lpsub{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .lpsub.show{display:grid}
  .lpo{border:0;background:var(--panel);cursor:pointer;border-radius:11px;height:44px;font-family:'Azeret Mono';font-weight:700;font-size:11px;color:var(--ink-soft);box-shadow:inset 2px 2px 5px var(--sh),inset -2px -2px 5px var(--hi)}
  .lpo.on{color:var(--accent-deep);box-shadow:-3px -3px 6px var(--hi),3px 3px 6px var(--sh)}

  .flow{display:flex;align-items:center;gap:10px;margin-top:18px}
  .back{border:0;background:var(--panel);cursor:pointer;border-radius:13px;height:48px;padding:0 18px;display:flex;align-items:center;gap:7px;font-family:'Archivo';font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:-3px -3px 7px var(--hi),4px 4px 9px var(--sh)}
  .back svg{stroke:var(--ink-soft)}
  .next{flex:1;border:0;background:var(--panel);cursor:pointer;border-radius:13px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Archivo';font-weight:800;font-size:14px;color:var(--accent-deep);box-shadow:-4px -4px 9px var(--hi),5px 5px 11px var(--sh)}
  .next svg{stroke:var(--accent-deep)}

  .strip{flex:0 0 auto;display:flex;padding-bottom:var(--sab);background:var(--panel);position:relative;z-index:6;box-shadow:inset 0 1px 0 var(--hi),0 -4px 9px var(--sh)}
  .util{flex:1;border:0;background:transparent;cursor:pointer;position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft)}
  .util svg{stroke:currentColor}.util .ul{font-family:'Azeret Mono';font-weight:700;font-size:8px;letter-spacing:.06em}
  .util .bdg{position:absolute;top:9px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-family:'Azeret Mono';font-weight:700;font-size:8px;display:flex;align-items:center;justify-content:center}
  .util + .util::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--sh)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="topnav"><div class="tabs"><button class="tab">Lobby</button><button class="tab on">Workspace</button><button class="tab">Reports</button></div></div>
  <div class="active"><span class="dot"></span><div class="aj"><div class="lbl">ACTIVE JOB</div><div class="addr">2416 Sable Ridge Ln</div><div class="meta">CADENCE AT BROOKWOOD · LENNAR</div></div><span class="total" id="total">$90</span><button class="cancel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>

  <div class="rail" id="rail"></div>
  <div class="scroll"><div class="section" id="section"></div></div>

  <div class="strip">
    <button class="util"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="ul">SETTINGS</span></button>
    <button class="util"><span class="bdg">2</span><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/></svg><span class="ul">TRANSFERS</span></button>
    <button class="util"><span class="bdg">5</span><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg><span class="ul">CHAT</span></button>
    <button class="util"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/></svg><span class="ul">CALC</span></button>
  </div>

<script>
  var STEPS=[{k:'srv',l:'SERVICE'},{k:'acc',l:'ACC'},{k:'fix',l:'FIX'},{k:'wght',l:'WGHT'},{k:'notes',l:'NOTES'}];
  var cur=1;
  var rail=document.getElementById('rail'),section=document.getElementById('section');
  // grupo que se auto-activa junto (inferido del legacy): UT3000 + DAPC + Ecoil Wire + eBypass
  var GROUP=['ut','da','ec','eb'];
  var sel={ut:true,da:true,ec:true,eb:true}; // grupo preseleccionado como en la captura
  var lpOpen=false, lpPick=null;

  function renderRail(){
    rail.innerHTML=STEPS.map(function(s,i){return '<button class="step'+(i===cur?' cur':'')+'" data-i="'+i+'"><span class="sd"></span><span class="sl">'+s.l+'</span></button>';}).join('');
    rail.querySelectorAll('.step').forEach(function(b){b.addEventListener('click',function(){cur=+b.getAttribute('data-i');renderRail();renderSection();});});
  }

  var TILES=[
    ['ut','UT3000','grp'],['hz','HZ322',''],
    ['da','DAPC','grp'],['ec','Ecoil Wire','grp'],['eb','eBypass','grp'],
    ['ha','Harmony',''],['by','Bypass',''],
    ['f1','FIN180P',''],['fs','Float Switch',''],['wd','Weigh-In Data',''],['dh','Dehum',''],
    ['th','Trane Harness',''],['ap','AprilAire',''],['fa','F/A',''],['f6','FIN6-MD',''],
    ['rd','RDS',''],['lp','LP Kit',''],['ot','Other','']
  ];

  function accContent(){
    var grid=TILES.map(function(t){
      var on=sel[t[0]]?' on':'';
      return '<button class="a '+t[0]+(t[2]?' grp':'')+on+'" data-k="'+t[0]+'">'+t[1]+'</button>';
    }).join('');
    var subs=['Lennox 1Stg','Lennox 2Stg','Goodman'].map(function(n,i){return '<button class="lpo'+(lpPick===i?' on':'')+'" data-lp="'+i+'">'+n+'</button>';}).join('');
    return '<div class="acc">'+grid+'</div><div class="lpsub'+(lpOpen?' show':'')+'">'+subs+'</div>';
  }

  function renderSection(){
    if(STEPS[cur].k!=='acc'){
      section.innerHTML='<div class="sec-head"><span class="bar"></span><span class="st">'+STEPS[cur].l+'</span></div><div style="padding:38px;text-align:center;font-family:Azeret Mono;font-size:11px;color:var(--ink-soft);background:var(--well);border-radius:14px;box-shadow:inset 4px 4px 9px var(--sh),inset -4px -4px 9px var(--hi)">Empty — its own phase</div>';
      return;
    }
    section.innerHTML='<div class="sec-head"><span class="bar"></span><span class="st">Accessories</span><span class="sub">STEP 2/5</span></div>'+accContent()+
      '<div class="flow"><button class="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back</button><button class="next">Next<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>';

    section.querySelectorAll('.a').forEach(function(b){b.addEventListener('click',function(){
      var k=b.getAttribute('data-k');
      if(GROUP.indexOf(k)>=0){var ns=!sel[k];GROUP.forEach(function(g){sel[g]=ns;});} // auto-activación del grupo
      else if(k==='lp'){sel.lp=!sel.lp;lpOpen=sel.lp;if(!sel.lp)lpPick=null;}
      else{sel[k]=!sel[k];}
      renderSection();
    });});
    section.querySelectorAll('.lpo').forEach(function(b){b.addEventListener('click',function(){lpPick=+b.getAttribute('data-lp');renderSection();});});
    section.querySelector('.back').addEventListener('click',function(){if(cur>0){cur--;renderRail();renderSection();}});
    section.querySelector('.next').addEventListener('click',function(){if(cur<STEPS.length-1){cur++;renderRail();renderSection();}});
  }
  renderRail();renderSection();
</script>
</body>
</html>
